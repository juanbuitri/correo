<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción Premium</title>

    <!-- Librería EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <script>
        (function () {
            // Tu Public Key de EmailJS
            emailjs.init("Q8Pmp_DRm_OAKDyyl");
        })();
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #38bdf8;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0ea5e9;
        }

        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>Únete a TechNews</h1>

        <p>
            Suscríbete para recibir noticias, descuentos y contenido exclusivo sobre tecnología.
        </p>

        <form id="contact-form">

            <input 
                type="email"
                name="user_email"
                id="user_email"
                placeholder="Ingresa tu correo"
                required
            >

            <button type="submit" id="btn-enviar">
                Suscribirme
            </button>

        </form>

    </div>
</div>

<script>

    const btn = document.getElementById('btn-enviar');

    document
        .getElementById('contact-form')
        .addEventListener('submit', function(event) {

        event.preventDefault();

        btn.innerText = 'Enviando...';
        btn.disabled = true;

        // IDs reales de EmailJS
        const serviceID = 'service_113hz4i';
        const templateID = 'template_51atcoo'; // Reemplaza con tu template ID

        emailjs.sendForm(service_113hz4i, template_51atcoo, this)
            .then(() => {

                btn.innerText = '¡Suscrito!';
                alert('¡Gracias por suscribirte a TechNews!');

                this.reset();

                setTimeout(() => {
                    btn.innerText = 'Suscribirme';
                    btn.disabled = false;
                }, 2000);

            })
            .catch((error) => {

                console.error('Error:', error);

                btn.innerText = 'Suscribirme';
                btn.disabled = false;

                alert('Error al enviar el formulario');

            });

    });

</script>

</body>
</html>
